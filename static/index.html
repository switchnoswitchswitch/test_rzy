<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI漫画转换器</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .upload-section {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-section:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .upload-section.dragover {
            border-color: #667eea;
            background-color: #f0f4ff;
        }

        .upload-icon {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 15px;
        }

        .file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .style-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .style-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .style-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .style-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .style-card.selected {
            border-color: #667eea;
            background-color: #f0f4ff;
        }

        .style-name {
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .style-description {
            font-size: 0.9rem;
            color: #666;
        }

        .strength-section {
            margin-bottom: 30px;
        }

        .strength-slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        .strength-slider::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .strength-value {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: #667eea;
        }

        .preview-section {
            margin-top: 30px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .preview-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .preview-info {
            text-align: left;
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }

        .text-content {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 0.9rem;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #c62828;
        }

        .success {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #2e7d32;
        }

        .file-list {
            margin-top: 20px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .file-name {
            font-weight: 500;
        }

        .file-size {
            color: #666;
            font-size: 0.9rem;
        }

        .remove-file {
            background: #ff5252;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .main-card {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .style-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-magic"></i> AI漫画转换器</h1>
            <p>上传漫画图片，选择画风，让AI为您创造全新的视觉体验</p>
        </div>

        <div class="main-card">
            <!-- 文件上传区域 -->
            <div class="upload-section" id="uploadArea">
                <div class="upload-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <div class="upload-text">
                    拖拽图片到这里或点击选择文件
                </div>
                <div class="upload-text" style="font-size: 0.9rem; color: #999;">
                    支持 JPG, PNG, GIF 格式，可选择多个文件
                </div>
                <input type="file" id="fileInput" class="file-input" multiple accept="image/*">
                <button class="btn" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-folder-open"></i> 选择文件
                </button>
            </div>

            <!-- 文件列表 -->
            <div class="file-list" id="fileList"></div>

            <!-- 画风选择 -->
            <div class="style-section">
                <h3 class="section-title">
                    <i class="fas fa-palette"></i> 选择画风
                </h3>
                <div class="style-grid" id="styleGrid">
                    <!-- 动态加载画风选项 -->
                </div>
            </div>

            <!-- 强度调节 -->
            <div class="strength-section">
                <h3 class="section-title">
                    <i class="fas fa-sliders-h"></i> 转换强度
                </h3>
                <input type="range" id="strengthSlider" class="strength-slider" 
                       min="0.1" max="1.0" step="0.1" value="0.7">
                <div class="strength-value" id="strengthValue">0.7</div>
            </div>

            <!-- 处理按钮 -->
            <div style="text-align: center;">
                <button class="btn" id="processBtn" onclick="processImages()">
                    <i class="fas fa-magic"></i> 开始转换
                </button>
            </div>

            <!-- 加载状态 -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在处理图片，请稍候...</p>
            </div>

            <!-- 消息显示 -->
            <div id="message"></div>

            <!-- 结果预览 -->
            <div class="preview-section" id="previewSection" style="display: none;">
                <h3 class="section-title">
                    <i class="fas fa-images"></i> 处理结果
                </h3>
                <div class="preview-grid" id="previewGrid">
                    <!-- 动态加载结果 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFiles = [];
        let selectedStyle = 'anime';
        let styles = {};

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadStyles();
            setupEventListeners();
        });

        // 加载画风选项
        async function loadStyles() {
            try {
                const response = await fetch('/api/styles');
                styles = await response.json();
                
                const styleGrid = document.getElementById('styleGrid');
                styleGrid.innerHTML = '';
                
                Object.keys(styles).forEach(styleKey => {
                    const style = styles[styleKey];
                    const styleCard = document.createElement('div');
                    styleCard.className = `style-card ${styleKey === selectedStyle ? 'selected' : ''}`;
                    styleCard.onclick = () => selectStyle(styleKey);
                    
                    styleCard.innerHTML = `
                        <div class="style-name">${style.name}</div>
                        <div class="style-description">${style.description}</div>
                    `;
                    
                    styleGrid.appendChild(styleCard);
                });
            } catch (error) {
                showMessage('加载画风选项失败', 'error');
            }
        }

        // 设置事件监听器
        function setupEventListeners() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const strengthSlider = document.getElementById('strengthSlider');

            // 文件拖拽
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                const files = Array.from(e.dataTransfer.files);
                addFiles(files);
            });

            // 文件选择
            fileInput.addEventListener('change', function(e) {
                const files = Array.from(e.target.files);
                addFiles(files);
            });

            // 强度滑块
            strengthSlider.addEventListener('input', function(e) {
                document.getElementById('strengthValue').textContent = e.target.value;
            });
        }

        // 添加文件
        function addFiles(files) {
            const validFiles = files.filter(file => {
                return file.type.startsWith('image/') && file.size < 10 * 1024 * 1024; // 10MB限制
            });

            selectedFiles = [...selectedFiles, ...validFiles];
            updateFileList();
        }

        // 更新文件列表显示
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            
            if (selectedFiles.length === 0) {
                fileList.innerHTML = '';
                return;
            }

            fileList.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <div>
                        <div class="file-name">${file.name}</div>
                        <div class="file-size">${formatFileSize(file.size)}</div>
                    </div>
                    <button class="remove-file" onclick="removeFile(${index})">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');
        }

        // 移除文件
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        // 选择画风
        function selectStyle(styleKey) {
            selectedStyle = styleKey;
            
            document.querySelectorAll('.style-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            event.target.closest('.style-card').classList.add('selected');
        }

        // 处理图片
        async function processImages() {
            if (selectedFiles.length === 0) {
                showMessage('请先选择要处理的图片', 'error');
                return;
            }

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('files', file);
            });
            formData.append('style', selectedStyle);
            formData.append('strength', document.getElementById('strengthSlider').value);

            // 显示加载状态
            document.getElementById('loading').classList.add('show');
            document.getElementById('processBtn').disabled = true;
            document.getElementById('message').innerHTML = '';

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    showMessage(result.message, 'success');
                    displayResults(result.results);
                } else {
                    showMessage(result.error || '处理失败', 'error');
                }
            } catch (error) {
                showMessage('网络错误，请重试', 'error');
            } finally {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('processBtn').disabled = false;
            }
        }

        // 显示结果
        function displayResults(results) {
            const previewSection = document.getElementById('previewSection');
            const previewGrid = document.getElementById('previewGrid');
            
            previewGrid.innerHTML = results.map(result => `
                <div class="preview-item">
                    <h4>原图: ${result.original_filename}</h4>
                    <img src="/uploads/${result.processed_filename}" class="preview-image" alt="原图">
                    
                    ${result.styled_image ? `
                        <h4>转换后 (${result.style.name})</h4>
                        <img src="/outputs/${result.styled_image}" class="preview-image" alt="转换后">
                    ` : '<p>风格转换失败</p>'}
                    
                    <div class="preview-info">
                        <h5><i class="fas fa-eye"></i> 图片内容理解</h5>
                        <p>${result.description}</p>
                        
                        ${result.texts.length > 0 ? `
                            <h5><i class="fas fa-font"></i> 识别的文字</h5>
                            ${result.texts.map(text => `
                                <div class="text-content">
                                    "${text.text}" (置信度: ${(text.confidence * 100).toFixed(1)}%)
                                </div>
                            `).join('')}
                        ` : '<p>未识别到文字内容</p>'}
                    </div>
                </div>
            `).join('');
            
            previewSection.style.display = 'block';
        }

        // 显示消息
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type}">${message}</div>`;
            
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
